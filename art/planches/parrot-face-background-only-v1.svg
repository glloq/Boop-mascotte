<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Boop parrot face background V1</title>
  <desc id="desc">Parrot-specific frontal face background with tall crown, tapered cheeks, face patches, and a large central beak-root zone. No eyes, beak, ears, or accessories.</desc>

  <defs>
    <linearGradient id="headRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1543F"/>
      <stop offset="0.52" stop-color="#DD3D32"/>
      <stop offset="1" stop-color="#B62C2A"/>
    </linearGradient>

    <linearGradient id="templeRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D83B31"/>
      <stop offset="1" stop-color="#98242A"/>
    </linearGradient>

    <linearGradient id="facePatch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7EE"/>
      <stop offset="0.62" stop-color="#F4E1D4"/>
      <stop offset="1" stop-color="#D8B8A5"/>
    </linearGradient>

    <linearGradient id="lowerWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6B138"/>
      <stop offset="1" stop-color="#DD6D2F"/>
    </linearGradient>

    <linearGradient id="sideBlue" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#2288C8"/>
      <stop offset="1" stop-color="#145F9F"/>
    </linearGradient>
  </defs>

  <g id="face-background">

    <!-- Tall, compact parrot skull -->
    <g id="head-core">
      <path id="skull-base"
        d="M120 13
           C87 13 61 29 48 56
           C36 80 36 114 45 145
           C55 179 80 205 120 217
           C160 205 185 179 195 145
           C204 114 204 80 192 56
           C179 29 153 13 120 13Z"
        fill="url(#headRed)"
        stroke="#4C2523"
        stroke-width="4.8"
        stroke-linejoin="round"/>

      <path id="crown-dome"
        d="M80 48
           C90 27 103 18 120 18
           C137 18 150 27 160 48
           C147 41 134 39 120 42
           C106 39 93 41 80 48Z"
        fill="#F76847"/>

      <path id="left-temple"
        d="M46 79
           C50 58 62 43 78 35
           C72 53 73 73 80 92
           C70 101 59 103 49 97
           C45 91 44 84 46 79Z"
        fill="url(#templeRed)"/>

      <path id="right-temple"
        d="M194 79
           C190 58 178 43 162 35
           C168 53 167 73 160 92
           C170 101 181 103 191 97
           C195 91 196 84 194 79Z"
        fill="url(#templeRed)"/>
    </g>

    <!-- Directional crown feather groups -->
    <g id="crown-feathers">
      <path d="M86 46 C90 57 98 65 107 69 C106 59 103 50 97 44 C92 43 89 44 86 46Z" fill="#C72F2D"/>
      <path d="M99 37 C102 50 109 60 117 66 C119 55 117 45 112 36 C107 35 103 35 99 37Z" fill="#E34033"/>
      <path d="M114 29 C113 43 115 55 120 67 C125 55 127 43 126 29 C122 27 118 27 114 29Z" fill="#FA7650"/>
      <path d="M141 37 C138 50 131 60 123 66 C121 55 123 45 128 36 C133 35 137 35 141 37Z" fill="#E34033"/>
      <path d="M154 46 C150 57 142 65 133 69 C134 59 137 50 143 44 C148 43 151 44 154 46Z" fill="#C72F2D"/>
    </g>

    <!-- Parrot-specific pale facial patches -->
    <g id="face-patches">
      <path id="left-face-patch"
        d="M103 67
           C87 57 70 60 60 74
           C50 88 49 108 56 126
           C63 145 77 156 96 155
           C92 141 91 128 92 112
           C93 94 97 79 103 67Z"
        fill="url(#facePatch)"/>

      <path id="right-face-patch"
        d="M137 67
           C153 57 170 60 180 74
           C190 88 191 108 184 126
           C177 145 163 156 144 155
           C148 141 149 128 148 112
           C147 94 143 79 137 67Z"
        fill="url(#facePatch)"/>

      <path id="left-patch-edge"
        d="M58 86
           C68 76 80 72 92 75
           C86 85 83 97 84 110
           C75 115 66 114 59 108
           C53 102 52 93 58 86Z"
        fill="#FDF0E7"/>

      <path id="right-patch-edge"
        d="M182 86
           C172 76 160 72 148 75
           C154 85 157 97 156 110
           C165 115 174 114 181 108
           C187 102 188 93 182 86Z"
        fill="#FDF0E7"/>
    </g>

    <!-- Strong beak-root framing: narrower above, large central socket below -->
    <g id="beak-root">
      <path id="forehead-to-beak"
        d="M108 61
           C113 74 117 88 120 103
           C123 88 127 74 132 61
           C128 55 124 51 120 48
           C116 51 112 55 108 61Z"
        fill="#B92C2B"/>

      <path id="beak-root-shadow"
        d="M86 116
           C95 106 107 101 120 101
           C133 101 145 106 154 116
           C151 129 143 139 131 147
           C127 150 123 152 120 153
           C117 152 113 150 109 147
           C97 139 89 129 86 116Z"
        fill="#9E332F"
        opacity="0.84"/>

      <path id="beak-root-light"
        d="M96 114
           C102 107 111 104 120 104
           C129 104 138 107 144 114
           C141 123 135 130 127 136
           C124 138 122 139 120 140
           C118 139 116 138 113 136
           C105 130 99 123 96 114Z"
        fill="#F3D8C4"/>
    </g>

    <!-- Cheeks taper inward instead of broad duck/round owl cheeks -->
    <g id="cheek-masses">
      <path id="left-cheek"
        d="M48 112
           C56 105 66 103 76 106
           C87 109 94 118 97 131
           C99 143 96 157 88 169
           C80 180 68 185 56 182
           C48 173 44 160 44 147
           C44 132 45 120 48 112Z"
        fill="#D23A31"/>

      <path id="left-cheek-warm"
        d="M58 135
           C67 131 77 133 85 139
           C92 145 95 154 93 163
           C88 172 80 178 70 180
           C62 174 57 164 56 153
           C55 146 56 140 58 135Z"
        fill="url(#lowerWarm)"/>

      <path id="right-cheek"
        d="M192 112
           C184 105 174 103 164 106
           C153 109 146 118 143 131
           C141 143 144 157 152 169
           C160 180 172 185 184 182
           C192 173 196 160 196 147
           C196 132 195 120 192 112Z"
        fill="#D23A31"/>

      <path id="right-cheek-warm"
        d="M182 135
           C173 131 163 133 155 139
           C148 145 145 154 147 163
           C152 172 160 178 170 180
           C178 174 183 164 184 153
           C185 146 184 140 182 135Z"
        fill="url(#lowerWarm)"/>
    </g>

    <!-- Small blue lateral feather panels, parrot-specific color break -->
    <g id="side-panels">
      <path id="left-blue-panel"
        d="M48 145
           C57 151 65 158 70 168
           C66 176 61 182 54 186
           C48 177 45 165 45 154
           C45 150 46 147 48 145Z"
        fill="url(#sideBlue)"/>

      <path id="right-blue-panel"
        d="M192 145
           C183 151 175 158 170 168
           C174 176 179 182 186 186
           C192 177 195 165 195 154
           C195 150 194 147 192 145Z"
        fill="url(#sideBlue)"/>
    </g>

    <!-- Narrow throat / lower face -->
    <g id="lower-face">
      <path id="lower-face-back"
        d="M76 164
           C87 181 103 192 120 197
           C137 192 153 181 164 164
           C160 188 145 207 120 216
           C95 207 80 188 76 164Z"
        fill="#C2352E"/>

      <path id="lower-face-warm"
        d="M90 170
           C99 183 110 191 120 194
           C130 191 141 183 150 170
           C146 189 136 202 120 208
           C104 202 94 189 90 170Z"
        fill="url(#lowerWarm)"/>

      <path id="chin-center"
        d="M105 178
           C110 186 116 191 120 194
           C124 191 130 186 135 178
           C133 194 128 204 120 211
           C112 204 107 194 105 178Z"
        fill="#F5C45B"/>
    </g>

    <!-- Fine directional feather detail -->
    <g id="surface-details" fill="none" stroke-width="1.25" stroke-linecap="round" opacity="0.56">
      <path d="M73 53 C81 49 89 49 97 52" stroke="#98272A"/>
      <path d="M143 52 C151 49 159 49 167 53" stroke="#98272A"/>
      <path d="M61 118 C68 115 75 116 81 119" stroke="#C79D8B"/>
      <path d="M159 119 C165 116 172 115 179 118" stroke="#C79D8B"/>
      <path d="M70 154 C77 152 84 154 90 158" stroke="#A92C2A"/>
      <path d="M150 158 C156 154 163 152 170 154" stroke="#A92C2A"/>
    </g>
  </g>
</svg>