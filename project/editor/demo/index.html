<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boop Mascotte runtime demo</title><style>body{max-width:720px;margin:auto;padding:2rem;font:16px system-ui;background:#10172a;color:#fff}#mascot{max-width:420px;margin:auto}button,input{min-height:44px}label{display:grid;gap:.5rem}</style></head><body><h1>Runtime demo</h1><p>This standalone page drives the same engine included in editor exports.</p><div id="mascot"><svg viewBox="0 0 200 200" aria-label="Mascot"><circle cx="100" cy="100" r="85" fill="#8bb6ff"/><circle id="demo-eye" cx="100" cy="90" r="16" fill="#10172a"/></svg></div><label>lookX <input type="range" aria-label="lookX" min="-1" max="1" step="0.1" value="0"></label><p><button data-state="idle">Idle</button> <button data-state="happy">Happy</button></p><script type="module" src="./demo.js"></script></body></html>
