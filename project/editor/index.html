<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG Mascot Rig Editor - MVP</title>
    <style>
      body { margin: 0; font-family: Inter, Arial, sans-serif; background: #111827; color: #f9fafb; }
      #app { display: grid; grid-template-columns: 270px 1fr 300px; height: 100vh; }
      .panel { border-right: 1px solid #374151; padding: 12px; overflow: auto; }
      .panel-right { border-left: 1px solid #374151; padding: 12px; overflow: auto; }
      #canvas { background: #1f2937; position: relative; }
      .toolbar button, .export button { margin-right: 6px; margin-bottom: 6px; }
      label { display: block; margin-top: 8px; font-size: 12px; color: #9ca3af; }
      input, select, textarea { width: 100%; margin-top: 4px; margin-bottom: 4px; }
      .layer-item { background: #1f2937; padding: 6px; margin-bottom: 4px; border: 1px solid #374151; cursor: pointer; }
      .layer-item.active { border-color: #60a5fa; }
      .small { font-size: 12px; color: #9ca3af; }
      .param-row { margin-bottom: 10px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
