/* Puppet handles: a control that sits on the mascot, not in a panel. */
/* A global button rule sets display, which beats the UA sheet's [hidden] rule, so hiding a handle has to be said out loud. */.puppet-handle[hidden],.rig-node-handle[hidden]{display:none!important}/* Pose chips: one press puts a part somewhere worth having a name. */

/* A hand's reach, while its handle is held. */
.puppet-reach{stroke:#79adff;stroke-width:1.5;stroke-dasharray:5 4;opacity:.85}
/* The nine head positions, drawn around the head handle. */
.puppet-halo{position:absolute;z-index:23;width:0;height:0;pointer-events:none}
/* The offer stands alone in the halo, so it may go over the handles; the pose dots may not. */
.puppet-halo[data-halo-offer]{z-index:25}

.puppet-halo i{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;border:1px solid #7f92b3;background:#0b1220cc;pointer-events:auto;cursor:pointer}

.puppet-halo i[data-halo-current=true]{outline:2px solid #79adff;outline-offset:2px}
.puppet-halo i:hover{transform:scale(1.4)}
/* The opener for a group's own controls: a hand has seven, and all of them at once buries the face. */
.puppet-expand{position:absolute;z-index:25;transform:translate(-50%,-50%);width:15px;height:15px;padding:0;border:1.5px solid #cfe0ff;border-radius:50%;background:#0b1220cc;cursor:pointer}
