<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG Mascot Rig Editor - MVP</title>
    <style>
:root{font-family:Inter,system-ui,sans-serif;color:#e5e7eb;background:#080d18;color-scheme:dark}*{box-sizing:border-box}body{margin:0;overflow:hidden}#app{height:100vh;display:grid;grid-template-rows:58px minmax(0,1fr) 190px}.topbar{display:flex;align-items:center;gap:20px;padding:9px 14px;border-bottom:1px solid #29344d;background:#11182a}.topbar strong{font-size:20px;color:#8bb6ff}.topbar strong span{color:#fff}.topbar nav{display:flex;gap:6px}.topbar nav:nth-of-type(2){margin-left:auto}.workspace{display:grid;grid-template-columns:300px minmax(320px,1fr) 340px;min-height:0}.panel,.panel-right{padding:12px;overflow:auto;background:#10172a}.panel{border-right:1px solid #29344d}.panel-right{border-left:1px solid #29344d}#canvas{position:relative;overflow:hidden;background:radial-gradient(circle at top,#263959,#0e1627)}#empty-state{position:absolute;z-index:5;inset:0;display:grid;place-content:center;text-align:center;background:radial-gradient(circle,#1d3151,#0d1423)}#empty-state[hidden]{display:none}.empty-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.bottom{display:grid;grid-template-columns:1fr 300px;gap:12px;padding:10px 14px;border-top:1px solid #29344d;background:#0f1728;overflow:auto}.bottom #preview-panel{display:flex;gap:14px;align-items:flex-start}.bottom #preview-panel>h3{margin:5px}.bottom .param-row{display:none}button,.button{display:inline-flex;align-items:center;justify-content:center;background:#245ed4;color:#fff;border:1px solid #3974eb;border-radius:7px;padding:7px 10px;font:inherit;font-size:12px;cursor:pointer;text-decoration:none}button:hover,.button:hover{background:#3372ed}button:disabled{opacity:.4;cursor:not-allowed}.secondary,.icon{background:#1d293e;border-color:#34445f}.danger{color:#fca5a5}input,select,textarea{width:100%;min-height:32px;margin:4px 0 7px;padding:4px 7px;border:1px solid #34445f;border-radius:6px;background:#0b1220;color:#f8fafc}input[type=checkbox]{width:auto;min-height:0}label{display:block;margin-top:7px;font-size:12px;color:#aebbd0}label.button{margin:0}.check{display:flex;gap:6px;align-items:center;color:#dbe5f5}.action-row,.inline,.card-title{display:flex;align-items:center;gap:7px}.action-row{margin:9px 0}.inline>*{min-width:0}.card-title{justify-content:space-between}.icon{padding:3px 7px}.manager-card{padding:8px;margin:7px 0;background:#141f35;border:1px solid #2d3d59;border-radius:8px}.chip-row{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.chip{border-radius:99px;background:#1d293e}.chip-active{background:#2563eb}.badge,.status-pill{border-radius:99px;background:#26344c;padding:2px 7px;font-size:11px}.status-pill{white-space:nowrap}.status-pill.dirty{color:#ffd48a}.small{font-size:11px;color:#99a8bd}.notice{padding:8px;margin-bottom:7px;border-radius:6px;background:#17233a;font-size:12px}.notice[data-tone=error],.notice.error{color:#fecaca;background:#451f2b}.notice[data-tone=warn]{color:#fde68a}details{margin:8px 0;padding:8px;border:1px solid #30405c;border-radius:8px;background:#0c1424}summary{cursor:pointer;font-weight:650;color:#dce7f8}h1{font-size:32px;margin-bottom:5px}h3{margin:7px 0}:focus-visible{outline:3px solid #7db3ff;outline-offset:2px}.layer-item{padding:5px;margin:4px 0;border:1px solid #334155;border-radius:6px}.layer-row{display:flex;gap:4px}.layer-label{flex:1;background:transparent}.layer-icon{padding:3px}.layer-item.active{border-color:#60a5fa}@media(max-width:1000px){.workspace{grid-template-columns:240px 1fr}.panel-right{display:none}.topbar strong span{display:none}}@media(max-width:700px){#app{grid-template-rows:auto minmax(0,1fr) 150px}.topbar{flex-wrap:wrap;gap:7px}.topbar nav{overflow:auto}.workspace{grid-template-columns:1fr}.panel{display:none}.bottom{grid-template-columns:1fr}.export{display:none}}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
